server:
  port: 8080
spring:
  application:
    name: foodloop-backend
  datasource:
    url: jdbc:mysql://localhost:3306/foodloop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:foodloop_user}
    password: ${DB_PASSWORD:ChangeMe123!}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
app:
  jwt:
    secret: ${JWT_SECRET:foodloop-dev-secret-change-me-in-production-0123456789}
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@foodloop.com}
    password: ${ADMIN_PASSWORD:Admin@123}
ml:
  url: ${ML_URL:http://localhost:8000}
